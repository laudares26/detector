# Configuração do app localizeobjetos no Fly.io (região gru - São Paulo).
# Gerada para bater com a configuração já existente do app em produção.

app = "detector-objetos"
primary_region = "gru"

[build]

[deploy]
  strategy = "immediate"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "60s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "performance-2x"
  memory = "2gb"
  # Pipeline enxuto (YOLO-World + tradutor) cabe com folga em 2gb.
